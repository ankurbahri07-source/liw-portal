name: Deploy portal to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload over FTP (portal files only; never touches /ops /attendance /mailer or config.php)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 195.35.44.219
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            config.php
            storage/**
            ops/**
            attendance/**
            mailer/**
